[package]
name = "tillbahrain"
version = "1.0.0"
description = "Bahrain-native offline-first retail POS"
authors = ["Tillbahrain"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "tillbahrain_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tillbahrain"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hmac = "0.12"
keyring = "3"
once_cell = "1"
rand = "0.8"
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "json"] }
subtle = "2"
tauri = { version = "2" }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ulid = { version = "1", features = ["serde"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
